name: Release

# Tag a version (e.g. v0.1.1) to build and verify the download zip: the CLI (which
# carries the signed WinDivert driver inside it), the window, the two .cmd helpers,
# the READMEs and both licences — plus a SHA-256 file to check it by. The zip is
# uploaded as a build artifact; the actual GitHub Release is published by hand so
# it is authored by the maintainer's account, not github-actions.
on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release --all
      - name: Self-contained binaries (no VC++ redist needed)
        shell: pwsh
        run: |
          foreach ($exe in 'target/release/mole.exe','target/release/mole-gui.exe') {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
            if ($text -match 'VCRUNTIME\d+\.dll' -or $text -match 'MSVCP\d+\.dll') {
              Write-Error "Dynamic CRT dependency in $exe — release would fail on a stock Windows."
              exit 1
            }
          }
          Write-Host "OK: binaries are statically linked."
      - name: Stage package
        shell: pwsh
        run: |
          $name = "Mole-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/release/mole.exe, target/release/mole-gui.exe $name/
          Copy-Item install.cmd, uninstall.cmd, README.md, README.tr.md, LICENSE $name/
          Copy-Item vendor/windivert/LICENSE $name/WinDivert-LICENSE.txt
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $files = @("$name.zip", "$name/mole.exe", "$name/mole-gui.exe")
          $lines = $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), (Split-Path $_ -Leaf)
          }
          # LF line endings, so `sha256sum -c` reads it as-is.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ($lines -join "`n") + "`n")
      - name: Upload build artifacts (published to Releases by hand)
        uses: actions/upload-artifact@v4
        with:
          name: Mole-${{ github.ref_name }}
          path: |
            Mole-${{ github.ref_name }}.zip
            SHA256SUMS.txt
