name: Release

# Tag a version (e.g. v0.1.0) to build the zip people download: the CLI (which
# carries the signed WinDivert driver inside it), the window, the two .cmd
# helpers, the READMEs and both licences — plus a SHA-256 file to check it by.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release --all
      - name: Stage package
        shell: pwsh
        run: |
          $name = "Mole-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/release/mole.exe, target/release/mole-gui.exe $name/
          Copy-Item install.cmd, uninstall.cmd, README.md, README.tr.md, LICENSE $name/
          Copy-Item vendor/windivert/LICENSE $name/WinDivert-LICENSE.txt
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $files = @("$name.zip", "$name/mole.exe", "$name/mole-gui.exe")
          $lines = $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), (Split-Path $_ -Leaf)
          }
          # LF line endings, so `sha256sum -c` reads it as-is.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ($lines -join "`n") + "`n")
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mole-${{ github.ref_name }}.zip
            SHA256SUMS.txt
