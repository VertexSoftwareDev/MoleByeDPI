name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release --all
      - name: Self-contained binaries (no VC++ redist needed)
        shell: pwsh
        run: |
          # The shipped exes must statically link the CRT, or they fail to start
          # on a stock Windows that lacks the Visual C++ Redistributable. Fail the
          # build if a dynamic CRT dependency (VCRUNTIME/MSVCP) sneaks back in.
          $bad = @()
          foreach ($exe in 'target/release/mole.exe','target/release/mole-gui.exe') {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
            if ($text -match 'VCRUNTIME\d+\.dll' -or $text -match 'MSVCP\d+\.dll') {
              $bad += $exe
            }
          }
          if ($bad.Count) {
            Write-Error "Dynamic CRT dependency found in: $($bad -join ', '). Ensure .cargo/config.toml sets +crt-static."
            exit 1
          }
          Write-Host "OK: mole.exe and mole-gui.exe are statically linked."
