[package]
name = "mole-gui"
description = "Mole's status-and-control window: measure the line, protect, and see the service's state at a glance."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mole-gui"
path = "src/main.rs"

[dependencies]
mole-core = { path = "../mole-core" }
mole-probe = { path = "../mole-probe" }
serde = { workspace = true }
# `glow` rather than `wgpu`: a plain control panel, a fast start, no Direct3D
# stack — the same choice Burrow made.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "persistence",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
# default-features off drops the Linux-only libxdo/gtk dependencies; we only build
# for Windows.
tray-icon = { version = "0.24", default-features = false }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
