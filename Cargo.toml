[workspace]
resolver = "2"
members = [
    "crates/mole-core",
    "crates/mole-dns",
    "crates/mole-probe",
    "crates/mole-cli",
    "crates/mole-gui",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
windows-sys = "0.61"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
